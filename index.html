es Riber Plate ¿En Octavos qué paso? \nte falto el segundo tiempo porque vos sos un cagón", "file": "gallina-esa-mancha-no-se-borra-mas.txt"}, {"title": "Gallina Esperanos Un Poquito Más", "lyrics": "Gallina esperanos un poquito más\n Ya nos vamos a encontrar\n Gallina esperanos un poquito más\n Ya nos vamos a encontrar\n \n Los de River tienen miedo\n Porque saben que esta banda tiene huevo\n En La Boca ya corrieron\n Y el domingo los vamos a correr de nuevo", "file": "gallina-esperanos-un-poquito-mas.txt"}, {"title": "Gallina puta te saluda tu papá", "lyrics": "Cómo te va Riveeer, cómo te va?\nGallina puta te saluda tu papá\nAguante no tenéeees, siempre corrés\ny las finales las mirás por la TV", "file": "gallina-puta-te-saluda-tu-papa.txt"}, {"title": "Gallina vos sos vigilante con boca nunca te plantaste", "lyrics": "Gallina vos sos vigilante con boca nunca te plantaste \nahora cuando no encontremos vamos a ver que hinchada tiene más aguante \nnadie viene a la boca tienen miedo de encontrarse \nVamos vamos jugadores que con esta hinchada hay que ir pa adelante\ndale dale boooo dale dale boooo dale dale booo", "file": "gallina-vos-sos-vigilante-con-boca-nunca-te-plantaste.txt"}, {"title": "Hincha de Boca vago y atorrante", "lyrics": "Como no voy a ser\n Como no voy a ser\n Hincha de Boca vago y atorrante\n Como no voy a ser\n Como no voy a ser\n Soy de Boca y tengo aguante\n Como no vas a ser\n Como no vas a ser\n Hincha de River puto y vigilante\n Como no vas a ser\n Como no vas a ser\n Si vos corres en todas partes", "file": "hincha-de-boca-vago-y-atorrante.txt"}, {"title": "Hoy tenemos que ganar la 12 vino re loca", "lyrics": "Hoy tenemos que ganar la 12 vino re loca,\nEn todas partes vamo’ a estar, esta es la barra de Boca;\nPorque te llevo en el corazón, no me importa más nada,\nDonde estés va a alentar, siempre va con vos, está descontrolada tu hinchada;\nLa vuelta vamos a dar, la 12 va a festejar, quiero verte salir primero,\nNo la traten de igualar, es la más loca que hay, la más grande del mundo entero;\nRiver no chamuyes más, ya nos vamos a encontrar, vamo’ a m…. el tercero,\nNunca nos vamo’ a olvidar que te fuiste al nacional y quemaste el gallinero.", "file": "hoy-tenemos-que-ganar-la-12-vino-re-loca.txt"}, {"title": "La azul y oro es mi pasión", "lyrics": "De chico te vengo a ver, y de vos me enamoré\nLa azul y oro es mi pasión, lo llevo en el corazón\nVamos los bosteros, vamos a ganar\nEs un sentimiento no puedo parar\nDale bo dale dale bo, dale bo dale dale bo, campeón\nLa vuelta vamos a dar, La 12 va festejar", "file": "la-azul-y-oro-es-mi-pasion.txt"}, {"title": "La Copa Libertadores es mi obsesión", "lyrics": "Y dale alegria alegria a mi corazon \nlo unico que te pido ganemos hoy \nla Copa Libertadores es mi obsesion \ntenes que dejar el alma y el corazon \nYa vas a ver,\nno somos como los putos de river plate", "file": "la-copa-libertadores-es-mi-obsesion.txt"}, {"title": "La más grande, la que nunca descendió", "lyrics": "La más grande, la que nunca descendió \nLa que quiere a Diego Armando maradooo\nDale dale dale booo\nQue vamos a salir campeón \nEstá barra nunca te va a abandonar \nEn el mundo no va a haber ninguna igual \nNi la muerte nos va a poder separar \nBoca juniors sos el beso de mamá \nSiempre te voy a alentar, nunca te voy a dejar \nLa que corre a independiente y al ciclón \nLa que corre a los put*s del tablón", "file": "la-mas-grande-la-que-nunca-descendio.txt"}, {"title": "Las gallinas son así", "lyrics": "Las gallinas son así,\nson las amargas de la Argentina\n Cuando no salen campeón,\nesas tribunas están vacías\n Yo soy de Boca señor,\ncantemos todos con alegría\n Aunque no salgas campeón,\nel sentimiento no se termina\n Y dale Bo,\ny dale dale Boca,\ny dale Bo,\ny dale dale Bo\n Y dale Bo,\ny dale dale Boca,\ny dale Booooooooo\n Y dale dale Bo", "file": "las-gallinas-son-asi.txt"}, {"title": "Llora riber porque descendió", "lyrics": "Yo sigo al Xeneize por amor\nBoca Juniors me robaste  "lyrics": "Muchas veces fui preso \ny muchas veces llore por vos \nyo a boca lo quiero \ny lo llevo a adentro del corazon.", "file": "muchas-veces-fui-preso-y-muchas-veces-llore-por-vos.txt"}, {"title": "Nadie quiere venir en la Bombonera", "lyrics": "Vamos Boca Juniors, sabés que yo te quiero\nSiempre voy con vos es un sentimiento \nAca esta la 12 la que siempre te acompaña\nLa que esta en las buenas y en las malas\nQue paso con el fantasma del decenso\nQue paso con las Gallinas y San Lorenzo\nNadie quiere venir en la Bombonera \nPreguntale a los putos de Avellaneda", "file": "nadie-quiere-venir-en-la-bombonera.txt"}, {"title": "Ni la muerte nos va a separar", "lyrics": "Bostero soy y Boca es la alegría de mi corazon \nsos mi vida sos mi pasion \nmas allá de todas explicacion \nA mi no me interesa en que cancha juegues \nlocal o visitante yo te vengo a ver \nni la muerte nos va a separar\ndesde el cielo te voy alentar", "file": "ni-la-muerte-nos-va-a-separar.txt"}, {"title": "No la traten de igualar es la más loca que hay", "lyrics": "Porque te llevo en el corazón\nNo me importa más nada \nDonde estés va a alentar siempre va con vos esta descontrolada \ntu hinchada\n\nLa vuelta vamos a dar la 12 va a festejar \nQuiero verte salir primero\n\nNo la traten de igualar es la más loca que hay\n\nLa más grande del mundo entero\n\nRiBer no chamuyes más ya nos vamos a encontrar Vamo a Mtrls el tercero\nNunca nos vamos a olvidar que te fuiste al nacional\n\ny quemáste el gallinero", "file": "no-la-traten-de-igualar-es-la-mas-loca-que-hay.txt"}, {"title": "No va a quedar ni una gallina viva", "lyrics": "Los vamos a matar\nLos vamos a matar\nNo va a quedar ni una gallina viva\nEn la boca va a haber\nEn la boca va a haber\nUn cementerio de gallinas", "file": "no-va-a-quedar-ni-una-gallina-viva.txt"}, {"title": "Nosotros alentamos pongan huevos que ganamos", "lyrics": "Nosotros alentamos\nOhhh\nNosotros alentamos\nOhhh\npongan huevos\nque ganamos\nOhhh", "file": "nosotros-alentamos-pongan-huevos-que-ganamos.txt"}, {"title": "Nunca hicimos amistades", "lyrics": "Nunca hicimos amistades... \nNunca las vamos a hacer... \nAmistades hacen los putos... \nQue no paran de correr", "file": "nunca-hicimos-amistades.txt"}, {"title": "Para ser campeón, hoy hay que ganar", "lyrics": "Hoy te vinimo a alentar\nPara ser campeón\nHoy hay que ganar\nDale dale dale Bo", "file": "para-ser-campeon-hoy-hay-que-ganar.txt"}, {"title": "Para todas las gallinas el regalo de papá", "lyrics": "Ya se acerca noche buena\nya se acerca navidad \npara todas las gallinas\nel regalo de papá", "file": "para-todas-las-gallinas-el-regalo-de-papa.txt"}, {"title": "Pasan los años jugadores y también campeonatos", "lyrics": "Señores yo soy de boca \ny lo sigo a todos lados \nno importa donde jueges t voy a alantar \npasan los años, jugadores y tambien campeonatos \nmi sentimiento nunca va a terminar \ny vamos boca no podemos perder \ny vamos boca que tenes q ganar \ndaria la vida por un campeonato \nuna vuelta mas", "file": "pasan-los-anos-jugadores-y-tambien-campeonatos.txt"}, {"title": "Podrán imitarnos pero jamas,pero jamás nos van a igualar", "lyrics": "Otra, otra vuelta Boca\nOtra, otra vuelta Boca\nSabes que siempre te vengo a ver, Xeneize\n Hay que poner mas huevo no podes perder, hay que ganar\n Esta es tu hinchada que te va a alentar\n En las buenas y en las malas hasta el final\n Podrán imitarnos pero jamás, pero jamás nos van a igualar", "file": "podran-imitarnos-pero-jamaspero-jamas-nos-van-a-igualar.txt"}, {"title": "Por que será", "lyrics": "Por que será que te sigo a todas partes, campeón\nPor que será que no se vivir \nCarnaval toda la vida y el xeneize la pasión \nSi no te veo, se me parte el corazón", "file": "por-que-sera.txt"}, {"title": "Porque te llevo en el corazón No me importa más nada", "lyrics": "Hoy tenemos que ganar\nla 12 vino re loca\nen todas partes Vamo a estar\nEsta es la barra de boca\nPorque te llevo en el corazón\nNo me importa más nada\nDonde estés va a alentar siempre va con vos esta descontrolada tu hinchada\nLa vuelta vamos a dar la 12 va a festejar\nQuiero verte salir primero\nNo la traten de igualar es la más loca que hay\nLa más grande del mundo entero\nRiBer no chamuyes más ya nos vamos a encontrar Vamo a Mtrls el tercero\nNunca nos vamos a olvidar que te fuiste al nacional y quemáste el gallinero", "file": "porque-te-llevo-en-el-corazon-no-me-importa-mas-nada.txt"}, {"title": "Que alegria que alegria, Ole, ole, ola!", "lyrics": "Que alegria que alegria,\nOle, ole, ola! \nVamos Boca todavia!, \nQue estas para ganar,\nCorriste en Mar del Plata, \nDe eso no te olvides,\nEl trapo de Di Carlo, \nNunca lo vas a ver, \nLa Boca es alegria, \nLa Boca es carnaval,\nVamos a correr a River hasta el Monumental...", "file": "que-alegria-que-alegria-ole-ole-ola.txt"}, {"title": "Que con esta Hinchada hay que salir primero", "lyrics": "Vamos Xeneixe pongan mas huevos \n Que con esta Hinchada hay que salir primero \n \n esas gallinas siempre corrieron \n Quemaron su cancha cuando descendieron \n \n vengan los borrachos a la bombonera \n vengan a la Boca a buscar las banderas \n Hacen amistades en Avellaneda \n tienen miedo de venir a la ribera\n \n dale dale dale dale dale Boca\n dale dale dale dale dale Boca\n dale dale dale dale dale Boca\n dale dale dale dale dale Boca", "file": "que-con-esta-hinchada-hay-que-salir-primero.txt"}, {"title": "Que paso con el Fantasma del descenso?", "lyrics": "Vamos Boca Juniors, sabés que yo te quiero \nSiempre voy con vos, es un sentimiento \nAca esta la 12 la que siempre te acompaña \nLa que esta en las buenas y en las malas \nQue paso con el fantasma del descenso \nQue paso con las gallinas y san lorenzo \nNadie quiere venir en la Bombonera \nPreguntale a los putos de Avellaneda", "file": "que-paso-con-el-fantasma-del-descenso.txt"}, {"title": "Queremos la copa", "lyrics": "dale dale bo!!!\nqueremos la copa\nla 12 esta loca y quiere un campeonato para festejar\nponga huevo xeneizes hoy no podemos perder", "file": "queremos-la-copa.txt"}, {"title": "Quiero quemar el gallinero", "lyrics": "Quiero quemar el gallinero,\nque se mueran los cuervos y la Guardia Imperial\n Vamos Xeneize con huevo valla al frente, te lo pide la gente no para de alentar\n Pasan los años, pasan los jugadores, La 12 está presente y no para de alentar\n Por eso yo te quiero dar, Boca mi corazón\n Yo te sigo a todas partes, gracias por salir campeón\n Vos vas a cobrar,\nRiver sos un cagón\n Esos no son los Borrachos,\nson los putos del Tablón", "file": "quiero-quemar-el-gallinero.txt"}, {"title": "Quiero ver a la 12 con todas sus banderas", "lyrics": "https://youtu.be/vVGHcVcHXZI\nQuiero ver a la 12\ncon todas sus banderas\nlas sombrillas los bombos\naunque AFA no quiera\nyo soy hincha de Boca\nyo no soy delincuente\nquiero ver a la 12\ncomo toda la gente.", "file": "quiero-ver-a-la-12-con-todas-sus-banderas.txt"}, {"title": "Racing Botón!", "lyrics": "Racing Botón! Racing Botón! Racing Botón! Racing Botón!\nCon el machete en la mano, la chapa en el corazón!\nSerás siempre vigilante! la academia racing club\nRacing Botón! Racing Botón! Racing Botón! Racing Botón!", "file": "racing-boton.txt"}, {"title": "Racing va a correr la yuta también", "lyrics": "Es una noche especial\nno se la valla a perder\nRacing va a correr\nla yuta tambien", "file": "racing-va-a-correr-la-yuta-tambien.txt"}, {"title": "River decime que se siente", "lyrics": "River decime que se siente,\nhaber jugado el Nacional\n Te juro que aunque pasen los años,\nnunca nos vamos a olvidar\n Que te fuiste a la B,\nquemaste el Monumental\n Esa mancha no se borra nunca mas\n Che gallina sos cagón, le pegaste a un jugador\n Que cobarde los Borrachos del Tablón", "file": "river-decime-que-se-siente.txt"}, {"title": "Señores soy de Boca y lo sigo a todos lados", "lyrics": "Señores soy de Boca y lo sigo a todos lados \ny no me importa donde juegues te voy a alentar \npasan los años jugadores y tambien campeo <script>
const songs = JSON.parse(document.getElementById('song-data').textContent);

function norm(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
}

function escapeHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const q = document.getElementById('q');
const results = document.getElementById('results');
const stats = document.getElementById('stats');
const clearBtn = document.getElementById('clear');

let debounceTimer = null;

function search() {
  const raw = q.value;
  const query = norm(raw);
  results.innerHTML = '';
  if (!query) {
    stats.textContent = songs.length + ' canciones cargadas. Escribí un fragmento para buscar.';
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = 'Probá con una frase, una palabra o un estribillo.';
    results.appendChild(hint);
    return;
  }

  const terms = query.split(' ').filter(Boolean);
  const matches = [];
  for (const song of songs) {
    const nTitle = norm(song.title);
    const nLyrics = norm(song.lyrics);
    const inTitle = terms.every(t => nTitle.includes(t));
    const inLyrics = terms.every(t => nLyrics.includes(t));
    if (inTitle || inLyrics) {
      const exactTitle = nTitle.includes(query);
      const exactLyrics = nLyrics.includes(query);
      const idx = nLyrics.indexOf(terms[0]);
      matches.push({ song, idx: idx < 0 ? 999999 : idx, inTitle, exactTitle, exactLyrics });
    }
  }

  matches.sort((a, b) => {
    const aExact = a.exactTitle || a.exactLyrics;
    const bExact = b.exactTitle || b.exactLyrics;
    if (aExact !== bExact) return aExact ? -1 : 1;
    if (a.inTitle !== b.inTitle) return a.inTitle ? -1 : 1;
    return a.idx - b.idx;
  });

  const shown = matches.slice(0, 40);
  stats.textContent = matches.length === 0
    ? 'Sin resultados.'
    : (matches.length + ' coincidencia' + (matches.length === 1 ? '' : 's') +
       (matches.length > shown.length ? ' (mostrando ' + shown.length + ')' : '') + '.');

  if (matches.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'No se encontró ninguna canción con ese fragmento. Probá con menos palabras.';
    results.appendChild(empty);
    return;
  }

  let resultIndex = 0;
  for (const m of shown) {
    const song = m.song;
    const nLyrics = norm(song.lyrics);
    const lines = song.lyrics.split('\n');
    const qn = query;
    // count matching lines
    let matchLines = 0;
    const renderedLines = lines.map(line => {
      const isMatch = norm(line).includes(qn) || terms.every(t => norm(line).includes(t));
      if (isMatch) matchLines++;
      const cls = isMatch ? 'line match' : 'line';
      return '<span class="' + cls + '">' + escapeHtml(line) + '</span>';
    }).join('\n');

    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML =
      '<details' + (resultIndex === 0 ? ' open' : '') + '>' +
        '<summary class="card-head">' +
          '<div>' +
            '<div class="card-title">' + escapeHtml(song.title) + '</div>' +
            '<div class="card-meta">' + escapeHtml(song.file) + '</div>' +
          '</div>' +
          '<span class="badge">' + matchLines + ' linea' + (matchLines === 1 ? '' : 's') + '</span>' +
        '</summary>' +
        '<div class="lyrics">' + renderedLines + '</div>' +
      '</details>';
    results.appendChild(card);
    resultIndex++;
  }
}

q.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(search, 120);
});
clearBtn.addEventListener('click', () => {
  q.value = '';
  q.focus();
  search();
});

search();
</script>
